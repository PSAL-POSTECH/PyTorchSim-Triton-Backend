# Makes the compiler installable and gives it a real entry point. The package
# is `pytorchsim_triton_compiler`; `pytorchsim` itself is a namespace holding nothing.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorchsim-triton-compiler"
version = "0.1.0"
description = "Compile Triton kernels for the PyTorchSim NPU: TTGIR to linalg, axis-based passes, RISC-V + vcix"
requires-python = ">=3.10"

[project.scripts]
pytorchsim-triton-compiler = "pytorchsim_triton_compiler.cli:main"

[tool.setuptools.packages.find]
include = ["pytorchsim_triton_compiler*"]

[tool.setuptools.package-data]
"pytorchsim_triton_compiler.lowering.elf" = ["*.c"]
