name: toolchain image

# The image the compiler image is FROM: spike and gem5 from their forks, TOGSim,
# the RISC-V toolchain, on the triton image (triton-image.yml) -- setup/Dockerfile's
# `toolchain` stage. Dispatch only, and tagged by a hash of the files that define it
# (versions.env, system.sh, restore.sh, the Dockerfile, the triton tag): a run whose
# tag already exists does nothing, and compiler-image.yml derives the same hash to
# find its base.
#
# An image and not a release: the consumer is `FROM`, and the pieces that are
# releases already (llvm-install.tar.gz and friends) are what restore.sh unpacks
# inside the build.
#
# Every repository the build reads is public, so it takes no token; GITHUB_TOKEN
# is what pushes to ghcr.

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: parallel jobs for restore.sh, scons and make
        type: number
        default: 24

# Two runs would race for one tag; the second waits for the first and then
# finds the tag built.
concurrency:
  group: toolchain-image
  cancel-in-progress: false

env:
  TRITON: ghcr.io/psal-postech/pytorchsim-triton-backend-triton
  IMAGE: ghcr.io/psal-postech/pytorchsim-triton-backend-toolchain

jobs:
  build:
    # Not in a `container:` -- `docker build` wants the runner host's docker,
    # and this one builds LLVM, so it is the big runner.
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 600
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: true

      - name: Tag
        id: tag
        run: |
          set -euo pipefail
          tag=$(setup/toolchain_tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "triton=$(setup/triton_tag.sh)" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$tag"

      - name: Login
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Triton image must exist
        run: |
          set -euo pipefail
          repo="${TRITON#ghcr.io/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer $(printf %s "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/${{ steps.tag.outputs.triton }}")
          echo "registry says $code for ${TRITON}:${{ steps.tag.outputs.triton }}"
          if [ "$code" != 200 ]; then
            echo "::error::$TRITON:${{ steps.tag.outputs.triton }} is not built -- dispatch the 'triton image' workflow first"
            exit 1
          fi

      - name: Already built?
        id: have
        run: |
          set -euo pipefail
          # The registry itself, not `docker manifest inspect`: the runner's docker
          # is podman, whose manifest inspect does not answer for a plain remote image.
          repo="${IMAGE#ghcr.io/}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer $(printf %s "${{ secrets.GITHUB_TOKEN }}" | base64 -w0)" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$repo/manifests/${{ steps.tag.outputs.tag }}")
          echo "registry says $code for ${IMAGE}:${{ steps.tag.outputs.tag }}"
          if [ "$code" = 200 ]; then
            echo "::notice::$IMAGE:${{ steps.tag.outputs.tag }} exists -- nothing to build"
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.have.outputs.have == 'false'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          set -euo pipefail
          docker build -f setup/Dockerfile --target toolchain \
            --build-arg JOBS="${{ inputs.jobs }}" \
            --build-arg TRITON_IMAGE="$TRITON:${{ steps.tag.outputs.triton }}" \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" -t "$IMAGE:latest" .
          docker image ls "$IMAGE"

      - name: Push
        if: steps.have.outputs.have == 'false'
        run: |
          set -euo pipefail
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:latest"
