name: images

# Four images in one chain, on every push and pull request -- setup/Dockerfile's stages on the
# vcix-accelerator environment image: triton -> toolchain -> prebuilt -> compiler. triton, toolchain
# and prebuilt are tagged by a hash of what decides them and skipped when that tag is in the registry.
# prebuilt is the toolchain with the accelerator model, the dialect and the extension built and what
# only builds them dropped, in a few layers (~1 GB against the toolchain's ~3 GB): the one image an
# ordinary commit pulls, on runners that cache none. So an ordinary commit costs that pull and the
# compiler stage, which builds no C++; a change to the dialect, the extension or the model rebuilds
# prebuilt from a pull of the toolchain, and a moved pin the layers above it (~25 min). The compiler image is
# built and timed on one node, never pulled: the job that builds it runs the GEMM, vector and attention
# validation reports from it on the tpuv6e machine with TOGSim, and pushes it (with the branch tag) for
# pushes only, not pull requests. Beside it, the same job builds and pushes <sha>-runtime, the compiler
# image less torch, which PyTorchSim's CI pulls.
#
# Every stage is built twice, natively, on the big runner of each host architecture (x64 on
# x86_64, arm64 on aarch64), and pushed as <tag>-x64 and <tag>-arm64; the manifest job joins each
# pair under the unsuffixed tag, so `docker pull <image>:<tag>` picks by host. The reports run on
# the arm64 build only (the aarch64 runners are the Mac Studio nodes); the x64 build is still
# built, smoke-tested and published.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: parallel jobs for the triton, TOGSim and model builds
        type: number
        default: 24
      report_jobs:
        description: kernels each validation report (GEMM, vector and attention, run at the same time) simulates at once; 0 is one per cpu of the runner
        type: number
        default: 0
      report_target:
        description: machine (a TOGSim config name or file) the GEMM, vector and attention validation reports compile and time every shape on
        type: string
        default: tpuv6e

# A newer commit on a pull request cancels that pull request's older run, whole. A push to main or
# develop is never cancelled: every commit there publishes its own image, which pins name.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # x86_64 builds: "on" builds and publishes every stage for x64 beside arm64; "off" (while the x86_64 nodes
  # cannot run jobs) builds arm64 alone and joins only it under the unsuffixed tags. Turn it back on here.
  X64_BUILDS: "off"
  TRITON: ghcr.io/psal-postech/pytorchsim-triton-backend-triton
  TOOLCHAIN: ghcr.io/psal-postech/pytorchsim-triton-backend-toolchain
  PREBUILT: ghcr.io/psal-postech/pytorchsim-triton-backend-prebuilt
  IMAGE: ghcr.io/psal-postech/pytorchsim-triton-backend
  JOBS: ${{ inputs.jobs || 24 }}

# The big self-hosted runner: `docker build` wants the host's docker, and the images are ~10 GB each.
# Each per-architecture job runs on the big runner of its architecture.
jobs:
  tags:
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 10
    outputs:
      env_image: ${{ steps.tag.outputs.env_image }}
      triton: ${{ steps.tag.outputs.triton }}
      toolchain: ${{ steps.tag.outputs.toolchain }}
      prebuilt: ${{ steps.tag.outputs.prebuilt }}
      arches: ${{ steps.tag.outputs.arches }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          . setup/versions.env
          { echo "env_image=$VCIX_ENV_IMAGE"
            echo "triton=$(setup/triton_tag.sh)"
            echo "toolchain=$(setup/toolchain_tag.sh)"
            echo "prebuilt=$(setup/prebuilt_tag.sh)"
            arm='{"arch":"arm64","runner":"aarch64","simulate":true}'
            x64='{"arch":"x64","runner":"x86_64","simulate":false}'
            if [ "$X64_BUILDS" = on ]; then echo "arches=[$x64,$arm]"; else echo "arches=[$arm]"; fi
          } | tee -a "$GITHUB_OUTPUT"

  triton:
    needs: tags
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, big, "${{ matrix.runner }}"]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: triton-${{ needs.tags.outputs.triton }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TRITON }}
          tag: ${{ needs.tags.outputs.triton }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: triton
          build_args: --build-arg VCIX_ENV_IMAGE=${{ needs.tags.outputs.env_image }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  toolchain:
    needs: [tags, triton]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, big, "${{ matrix.runner }}"]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: toolchain-${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TOOLCHAIN }}
          tag: ${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: toolchain
          build_args: --build-arg TRITON_IMAGE=${{ env.TRITON }}:${{ needs.tags.outputs.triton }}-${{ matrix.arch }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  prebuilt:
    needs: [tags, toolchain]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, big, "${{ matrix.runner }}"]
    timeout-minutes: 120
    permissions: {contents: read, packages: write}
    concurrency:
      group: prebuilt-${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.PREBUILT }}
          tag: ${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: prebuilt
          build_args: --build-arg TOOLCHAIN_IMAGE=${{ env.TOOLCHAIN }}:${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Built on this node and never pulled anywhere: the arm64 job times the reports from the image it just built,
  # the kernels PyTorchSim's bundle holds (validation/pytorchsim) for gemm, vector and attention at once in three
  # containers of REPORT_JOBS kernels each (REPORT_JOBS is one per cpu of the runner unless report_jobs says
  # otherwise), every workload of gemm and vector, and the attention workloads under its CI cap (--ci); each report
  # sets every workload against the results main's last run left. The x64 job builds, smoke-tests (the Dockerfile's
  # doctor + smoke) and publishes only.
  compiler:
    needs: [tags, prebuilt]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, big, "${{ matrix.runner }}"]
    timeout-minutes: 180
    permissions: {contents: read, packages: write, actions: read}
    concurrency:
      group: compiler-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CONTAINER: rep-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      REPORT_JOBS: ${{ inputs.report_jobs || 0 }}
      REPORT_TARGET: ${{ inputs.report_target || 'tpuv6e' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: ref
        shell: bash
        run: echo "ref=$(printf %s '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}-${{ matrix.arch }}
          also_tag: ${{ steps.ref.outputs.ref }}-${{ matrix.arch }}
          target: compiler
          always: "true"
          push: ${{ github.event_name != 'pull_request' }}
          build_args: --build-arg PREBUILT_IMAGE=${{ env.PREBUILT }}:${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # The runtime image of the compiler image just built (its stages are this builder's cache): what
      # PyTorchSim's base image is FROM, as <sha>-runtime.
      - uses: ./.github/actions/image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}-runtime-${{ matrix.arch }}
          also_tag: ${{ steps.ref.outputs.ref }}-runtime-${{ matrix.arch }}
          target: runtime
          always: "true"
          push: ${{ github.event_name != 'pull_request' }}
          build_args: --build-arg PREBUILT_IMAGE=${{ env.PREBUILT }}:${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: simulate
        name: simulate
        if: matrix.simulate
        timeout-minutes: 90
        shell: bash
        run: |
          set -uo pipefail
          hostname; uname -m; nproc; free -g
          [ "$REPORT_JOBS" -gt 0 ] || REPORT_JOBS=$(nproc)
          echo "REPORT_JOBS=$REPORT_JOBS"
          sim() {
            rm -rf "$1-validation"; mkdir -p "$1-validation"
            local t0=$SECONDS
            docker run --rm --name "$CONTAINER-$1-sim" --cpus "$REPORT_JOBS" -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD/$1-validation:/out" -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" \
              python3 "validation/$1/simulate_shapes.py" --out /out --work /tmp/work --jobs "$REPORT_JOBS" \
                --timeout 900 --target "$REPORT_TARGET" "${@:2}" 2>&1 | sed -u "s/^/[$1] /"
            local rc=${PIPESTATUS[0]}
            echo "$1 simulate exit $rc after $((SECONDS - t0)) s on $(hostname)"
            return "$rc"
          }
          sim gemm & gemm=$!
          sim vector & vector=$!
          sim attention --ci & attention=$!
          wait $gemm; rc_gemm=$?
          wait $vector; rc_vector=$?
          wait $attention; rc_attention=$?
          [ "$rc_gemm" = 0 ] && [ "$rc_vector" = 0 ] && [ "$rc_attention" = 0 ]
      # main's last results, which each report sets this run against (none on main's first run of them).
      - name: baseline
        if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: rm -rf baseline && .github/validation_baseline.sh baseline
      - name: report
        if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' }}
        shell: bash
        run: |
          set -uo pipefail
          docker rm -f "$CONTAINER-gemm-sim" "$CONTAINER-vector-sim" "$CONTAINER-attention-sim" >/dev/null 2>&1 || true
          rc=0
          for r in gemm vector attention; do
            if [ ! -f "$r-validation/results.json" ]; then echo "::warning::$r left no results.json"; rc=1; continue; fi
            base=()
            if [ -f "baseline/$r/results.json" ]; then
              base=(--baseline /out/baseline.json --baseline-commit "$(cat baseline/commit)")
              cp "baseline/$r/results.json" "$r-validation/baseline.json"
            fi
            docker run --rm --name "$CONTAINER-$r-report" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/$r-validation:/out" \
              -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" \
              python3 "validation/$r/emit_report.py" --results /out/results.json --out /out "${base[@]}" \
                --shapes /out/generated/shapes.csv --commit "$HEAD_SHA" --ref "$REF" \
                --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/$HEAD_SHA" \
                --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --artifact "$r-validation-$HEAD_SHA" || rc=1
            if [ -f "$r-validation/summary.md" ]; then cat "$r-validation/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          exit $rc
      - if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' && hashFiles('gemm-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gemm-validation-${{ env.HEAD_SHA }}
          path: |
            gemm-validation/report.html
            gemm-validation/summary.md
            gemm-validation/results.json
            gemm-validation/results.csv
            gemm-validation/logs/
            gemm-validation/generated/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' && hashFiles('vector-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-validation-${{ env.HEAD_SHA }}
          path: |
            vector-validation/report.html
            vector-validation/summary.md
            vector-validation/results.json
            vector-validation/results.csv
            vector-validation/logs/
            vector-validation/generated/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' && hashFiles('attention-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attention-validation-${{ env.HEAD_SHA }}
          path: |
            attention-validation/report.html
            attention-validation/summary.md
            attention-validation/results.json
            attention-validation/results.csv
            attention-validation/logs/
            attention-validation/generated/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: always()
        shell: bash
        run: |
          docker rm -f "$CONTAINER-gemm-sim" "$CONTAINER-vector-sim" "$CONTAINER-attention-sim" "$CONTAINER-gemm-report" \
            "$CONTAINER-vector-report" "$CONTAINER-attention-report" >/dev/null 2>&1 || true

  # Each image's per-architecture pair joined under the unsuffixed tag -- the tag the next stage's FROM, PyTorchSim's
  # pin and anyone pulling it name -- so it resolves to the build of the host. imagetools works on the registry and
  # needs no builder container. The compiler pair is joined for pushes only: pull requests do not publish it.
  manifest:
    needs: [tags, compiler]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, packages: write}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        env:
          TRITON_TAG: ${{ needs.tags.outputs.triton }}
          TOOLCHAIN_TAG: ${{ needs.tags.outputs.toolchain }}
          PREBUILT_TAG: ${{ needs.tags.outputs.prebuilt }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
          ARCHES: ${{ needs.tags.outputs.arches }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archs=$(jq -r '.[].arch' <<<"$ARCHES")
          wants=$(sed 's/^x64$/amd64/' <<<"$archs")
          join() {
            docker buildx imagetools create -t "$1:$2" $(for a in $archs; do echo "$1:$2-$a"; done)
            got=$(docker buildx imagetools inspect --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}' "$1:$2")
            echo "$1:$2 -> $got"
            for want in $wants; do
              case " $got " in *" $want "*) ;; *) echo "::error::$1:$2 has no $want"; exit 1 ;; esac
            done
          }
          join "$TRITON" "$TRITON_TAG"
          join "$TRITON" latest
          join "$TOOLCHAIN" "$TOOLCHAIN_TAG"
          join "$TOOLCHAIN" latest
          join "$PREBUILT" "$PREBUILT_TAG"
          join "$PREBUILT" latest
          if [ "$PUBLISH" = true ]; then
            join "$IMAGE" "$SHA"
            join "$IMAGE" "$(printf %s "$REF_NAME" | tr '/' '-')"
            join "$IMAGE" "$SHA-runtime"
            join "$IMAGE" "$(printf %s "$REF_NAME" | tr '/' '-')-runtime"
          fi

  # After main's image is published and its reports pass, PyTorchSim gets a pull request moving its compiler pin
  # here: one branch (bot/ptb-bump) force-pushed from its integration branch, one open pull request, the newest
  # main commit winning. A newer run cancels an older one. Needs the PTS_BUMP_TOKEN secret, which can push to
  # PyTorchSim and open pull requests there; this workflow's own token reads this repository and its image.
  pts-pin-bump:
    needs: [compiler, manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    concurrency:
      group: pts-pin-bump
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, persist-credentials: false}
      - shell: bash
        env:
          PTB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTS_TOKEN: ${{ secrets.PTS_BUMP_TOKEN }}
          NEW: ${{ github.sha }}
        run: |
          if [ -z "$PTS_TOKEN" ]; then echo "::error::the PTS_BUMP_TOKEN secret is not set: no pin bump for PyTorchSim"; exit 1; fi
          .github/pts_pin_bump.sh
