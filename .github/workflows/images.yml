name: images

# Three images in one chain, on every push and pull request -- setup/Dockerfile's stages on the
# vcix-accelerator environment image. triton and toolchain are tagged by a hash of what decides
# them and skipped when that tag is in the registry, so an ordinary commit costs the compiler
# stage alone (~5 min) and a moved pin rebuilds the layers above it (~25 min) by itself. The
# compiler image is pushed for a push only, never from a pull request. The compiler job then times
# validation/gemm's shapes on the v6e MXU target (libtpu_mxu.so, the tpuv6e_mxu TOGSim config) with
# TOGSim on the image it just built and uploads the GEMM report.

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: parallel jobs for the triton, TOGSim and model builds
        type: number
        default: 24
      report_jobs:
        description: kernels the GEMM validation report simulates at once
        type: number
        default: 8
      report_target:
        description: target JSON the GEMM validation report compiles and times every shape on
        type: choice
        options: [tests/targets/tpuv6e_mxu.json, tests/targets/tpuv6e.json]
        default: tests/targets/tpuv6e_mxu.json

env:
  TRITON: ghcr.io/psal-postech/pytorchsim-triton-backend-triton
  TOOLCHAIN: ghcr.io/psal-postech/pytorchsim-triton-backend-toolchain
  IMAGE: ghcr.io/psal-postech/pytorchsim-triton-backend
  JOBS: ${{ inputs.jobs || 24 }}

# The big self-hosted runner: `docker build` wants the host's docker, and the images are ~10 GB each.
jobs:
  tags:
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 10
    outputs:
      env_image: ${{ steps.tag.outputs.env_image }}
      triton: ${{ steps.tag.outputs.triton }}
      toolchain: ${{ steps.tag.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          . setup/versions.env
          { echo "env_image=$VCIX_ENV_IMAGE"
            echo "triton=$(setup/triton_tag.sh)"
            echo "toolchain=$(setup/toolchain_tag.sh)"; } | tee -a "$GITHUB_OUTPUT"

  triton:
    needs: tags
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: triton-${{ needs.tags.outputs.triton }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TRITON }}
          tag: ${{ needs.tags.outputs.triton }}
          also_tag: latest
          target: triton
          build_args: --build-arg VCIX_ENV_IMAGE=${{ needs.tags.outputs.env_image }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  toolchain:
    needs: [tags, triton]
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: toolchain-${{ needs.tags.outputs.toolchain }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TOOLCHAIN }}
          tag: ${{ needs.tags.outputs.toolchain }}
          also_tag: latest
          target: toolchain
          build_args: --build-arg TRITON_IMAGE=${{ env.TRITON }}:${{ needs.tags.outputs.triton }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  compiler:
    needs: [tags, toolchain]
    runs-on: [self-hosted, slurm, big, x86_64]
    timeout-minutes: 180
    permissions: {contents: read, packages: write}
    concurrency:
      group: compiler-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      OUT: ${{ github.workspace }}/gemm-validation
      CONTAINER: gemmrep-${{ github.run_id }}-${{ github.run_attempt }}
      REPORT_JOBS: ${{ inputs.report_jobs || 8 }}
      REPORT_TARGET: ${{ inputs.report_target || 'tests/targets/tpuv6e_mxu.json' }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: ref
        shell: bash
        run: echo "ref=$(printf %s '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}
          also_tag: ${{ steps.ref.outputs.ref }}
          target: compiler
          always: "true"
          push: ${{ github.event_name != 'pull_request' }}
          build_args: --build-arg TOOLCHAIN_IMAGE=${{ env.TOOLCHAIN }}:${{ needs.tags.outputs.toolchain }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: simulate
        name: simulate
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"; mkdir -p "$OUT"
          docker run --rm --name "$CONTAINER-sim" --cpus "$REPORT_JOBS" -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$OUT:/out" -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}" \
            python3 validation/gemm/simulate_shapes.py --out /out --work /tmp/work --jobs "$REPORT_JOBS" --timeout 900 \
              --target "$REPORT_TARGET"
      - name: report
        if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' && hashFiles('gemm-validation/results.json') != '' }}
        shell: bash
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          docker rm -f "$CONTAINER-sim" >/dev/null 2>&1 || true
          docker run --rm --name "$CONTAINER-report" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$OUT:/out" \
            -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}" \
            python3 validation/gemm/emit_report.py --results /out/results.json --out /out \
              --commit "$HEAD_SHA" --ref "$REF" \
              --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/$HEAD_SHA" \
              --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --artifact "gemm-validation-$HEAD_SHA"
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && steps.simulate.outcome != 'skipped' && hashFiles('gemm-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gemm-validation-${{ env.HEAD_SHA }}
          path: |
            ${{ env.OUT }}/report.html
            ${{ env.OUT }}/summary.md
            ${{ env.OUT }}/results.json
            ${{ env.OUT }}/results.csv
            ${{ env.OUT }}/logs/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: always()
        shell: bash
        run: docker rm -f "$CONTAINER-sim" "$CONTAINER-report" >/dev/null 2>&1 || true
