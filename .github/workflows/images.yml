name: images

# Four images in one chain, on every push and pull request -- setup/Dockerfile's stages on the
# vcix-accelerator environment image: triton -> toolchain -> prebuilt -> compiler. triton, toolchain
# and prebuilt are tagged by a hash of what decides them and skipped when that tag is in the registry.
# prebuilt is the toolchain with the accelerator model, the dialect and the extension built and what
# only builds them dropped, in a few layers (~1 GB against the toolchain's ~3 GB): the one image an
# ordinary commit pulls, on runners that cache none. So an ordinary commit costs that pull and the
# compiler stage, which builds no C++; a change to the dialect, the extension or the model rebuilds
# prebuilt from a pull of the toolchain, and a moved pin the layers above it (~25 min). The compiler image is
# built and timed on one node, never pulled: the job that builds it runs the GEMM, vector, attention and layer
# validation reports from it on the tpuv6e machine with TOGSim, and pushes it (with the branch tag) for
# pushes only, not pull requests. It is also tagged <sha>-runtime, which PyTorchSim's CI pulls: its torch is the
# one PyTorchSim states (validation/pytorchsim/bundle.json), so there is nothing to take out of it.
#
# Every stage is built twice, natively, on the med runner of each host architecture (x64 on
# x86_64, arm64 on aarch64), and pushed as <tag>-x64 and <tag>-arm64; the manifest job joins each
# pair under the unsuffixed tag, so `docker pull <image>:<tag>` picks by host. The reports run on
# the arm64 build only (the aarch64 runners are the Mac Studio nodes); the x64 build is still
# built, smoke-tested and published.

on:
  push:
    branches: [develop, main]
  # A pull request labelled ci:<suite> times only the labelled suites; adding or removing one of those labels reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      jobs:
        description: parallel jobs for the triton, TOGSim and model builds (the med runner has 8 CPUs)
        type: number
        default: 8
      report_jobs:
        description: kernels each validation report (GEMM, vector, attention and layer, run at the same time) simulates at once; 0 is one per cpu of the runner
        type: number
        default: 0
      report_target:
        description: machine (a TOGSim config name or file) the GEMM, vector, attention and layer validation reports compile and time every shape on
        type: string
        default: tpuv6e

# A newer commit on a pull request cancels that pull request's older run, whole. A push to main or
# develop is never cancelled: every commit there publishes its own image, which pins name. Adding or removing any
# other label starts a run that does nothing, in a group of its own, so it cancels nothing either.
concurrency:
  group: images-${{ github.event_name == 'pull_request' && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || contains(fromJSON('["ci:gemm","ci:vector","ci:attention","ci:layer"]'), github.event.label.name)) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # x86_64 builds: "on" builds and publishes every stage for x64 beside arm64; "off" (while the x86_64 nodes
  # cannot run jobs) builds arm64 alone and joins only it under the unsuffixed tags. Turn it back on here.
  X64_BUILDS: "off"
  TRITON: ghcr.io/psal-postech/pytorchsim-triton-backend-triton
  TOOLCHAIN: ghcr.io/psal-postech/pytorchsim-triton-backend-toolchain
  PREBUILT: ghcr.io/psal-postech/pytorchsim-triton-backend-prebuilt
  IMAGE: ghcr.io/psal-postech/pytorchsim-triton-backend
  JOBS: ${{ inputs.jobs || 8 }}
  # How many nodes each suite's report is split over (the simulate matrix); a suite not named takes one.
  SHARDS: "gemm=3 vector=3 attention=4 layer=1"

# The med self-hosted runner (8 CPUs, 32 GB): `docker build` wants the host's docker, and the images are ~10 GB each.
# Each per-architecture job runs on the med runner of its architecture.
jobs:
  tags:
    # A dispatch on claude/* runs unreviewed code: it waits for the `probe` environment's approval.
    if: ${{ !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || contains(fromJSON('["ci:gemm","ci:vector","ci:attention","ci:layer"]'), github.event.label.name) }}
    environment: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/claude/') && 'probe' || '' }}
    runs-on: [self-hosted, slurm, med, aarch64]
    timeout-minutes: 10
    outputs:
      env_image: ${{ steps.tag.outputs.env_image }}
      triton: ${{ steps.tag.outputs.triton }}
      toolchain: ${{ steps.tag.outputs.toolchain }}
      prebuilt: ${{ steps.tag.outputs.prebuilt }}
      arches: ${{ steps.tag.outputs.arches }}
      suites: ${{ steps.suites.outputs.suites }}
      partial: ${{ steps.suites.outputs.partial }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          . setup/versions.env
          { echo "env_image=$VCIX_ENV_IMAGE"
            echo "triton=$(setup/triton_tag.sh)"
            echo "toolchain=$(setup/toolchain_tag.sh)"
            echo "prebuilt=$(setup/prebuilt_tag.sh)"
            arm='{"arch":"arm64","runner":"aarch64","simulate":true}'
            x64='{"arch":"x64","runner":"x86_64","simulate":false}'
            if [ "$X64_BUILDS" = on ]; then echo "arches=[$x64,$arm]"; else echo "arches=[$arm]"; fi
          } | tee -a "$GITHUB_OUTPUT"
      # The validation suites this run times: those a pull request's ci:<suite> labels name, every suite without one.
      - id: suites
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          all=(gemm vector attention layer); sel=()
          for s in "${all[@]}"; do jq -e --arg l "ci:$s" '(. // []) | index($l)' <<<"$LABELS" >/dev/null && sel+=("$s"); done
          if [ ${#sel[@]} = 0 ]; then echo "suites=${all[*]}"; echo partial=false
          else echo "suites=${sel[*]}"; echo partial=true; fi | tee -a "$GITHUB_OUTPUT"
      # The simulate matrix: SHARDS parts of every suite this run times.
      - id: shards
        shell: bash
        env:
          SUITES: ${{ steps.suites.outputs.suites }}
        run: |
          set -euo pipefail
          declare -A n=(); for kv in $SHARDS; do n[${kv%%=*}]=${kv#*=}; done
          for s in $SUITES; do
            for ((k = 0; k < ${n[$s]:-1}; k++)); do jq -nc --arg s "$s" --argjson k "$k" --argjson n "${n[$s]:-1}" '{suite: $s, k: $k, n: $n}'; done
          done | jq -sc . | sed 's/^/shards=/' | tee -a "$GITHUB_OUTPUT"

  triton:
    needs: tags
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, med, "${{ matrix.runner }}"]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: triton-${{ needs.tags.outputs.triton }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TRITON }}
          tag: ${{ needs.tags.outputs.triton }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: triton
          build_args: --build-arg VCIX_ENV_IMAGE=${{ needs.tags.outputs.env_image }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  toolchain:
    needs: [tags, triton]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, med, "${{ matrix.runner }}"]
    timeout-minutes: 600
    permissions: {contents: read, packages: write}
    concurrency:
      group: toolchain-${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.TOOLCHAIN }}
          tag: ${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: toolchain
          build_args: --build-arg TRITON_IMAGE=${{ env.TRITON }}:${{ needs.tags.outputs.triton }}-${{ matrix.arch }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  prebuilt:
    needs: [tags, toolchain]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, med, "${{ matrix.runner }}"]
    timeout-minutes: 120
    permissions: {contents: read, packages: write}
    concurrency:
      group: prebuilt-${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - uses: ./.github/actions/image
        with:
          image: ${{ env.PREBUILT }}
          tag: ${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
          also_tag: latest-${{ matrix.arch }}
          target: prebuilt
          build_args: --build-arg TOOLCHAIN_IMAGE=${{ env.TOOLCHAIN }}:${{ needs.tags.outputs.toolchain }}-${{ matrix.arch }} --build-arg JOBS=${{ env.JOBS }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Built on this node, smoke-tested (the Dockerfile's doctor + smoke) and pushed as <sha>-<arch> for every run, so the
  # simulate shards and the report pull it; the branch and -runtime tags only for pushes, not pull requests. A pull
  # request's newer commit cancels its older build; on a branch every commit builds, none waits for another's.
  compiler:
    needs: [tags, prebuilt]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.arches) }}
    runs-on: [self-hosted, slurm, med, "${{ matrix.runner }}"]
    timeout-minutes: 180
    permissions: {contents: read, packages: write}
    concurrency:
      group: compiler-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CONTAINER: rep-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, submodules: recursive}
      - id: ref
        shell: bash
        run: echo "ref=$(printf %s '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ github.sha }}-${{ matrix.arch }}
          also_tag: >-
            ${{ steps.ref.outputs.ref }}-${{ matrix.arch }} ${{ github.sha }}-runtime-${{ matrix.arch }}
            ${{ steps.ref.outputs.ref }}-runtime-${{ matrix.arch }}
          target: compiler
          always: "true"
          push_also: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/claude/') }}
          build_args: --build-arg PREBUILT_IMAGE=${{ env.PREBUILT }}:${{ needs.tags.outputs.prebuilt }}-${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # The layer report's own check (an incomplete workload is in no verdict), in the image it runs in.
      - name: validation tests
        if: matrix.simulate
        shell: bash
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -w /workspace/pytorchsim-triton-compiler \
            "$IMAGE:${{ github.sha }}-${{ matrix.arch }}" python3 validation/layer/test_incomplete.py
      - if: always()
        shell: bash
        run: docker rm -f "$CONTAINER-validation-tests" >/dev/null 2>&1 || true

  # One shard of one suite's report (validation/<suite>/simulate_shapes.py --shard K/N, the largest workloads spread
  # over the shards first; SHARDS says how many a suite has), on a node of its own from the image the compiler job
  # pushed: every workload of vector and attention, and those of gemm and layer under their CI caps (--ci). A pull
  # request reuses main's timing of every kernel whose timing key main's last run holds (--reuse, from the baseline).
  simulate:
    needs: [tags, compiler]
    name: simulate ${{ matrix.suite }} ${{ matrix.k }}/${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.tags.outputs.shards) }}
    runs-on: [self-hosted, slurm, med, aarch64]
    timeout-minutes: 120
    permissions: {contents: read, packages: read, actions: read}
    env:
      CONTAINER: sim-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.k }}
      REPORT_JOBS: ${{ inputs.report_jobs || 0 }}
      REPORT_TARGET: ${{ inputs.report_target || 'tpuv6e' }}
      SUITE: ${{ matrix.suite }}
      SHARD: ${{ matrix.k }}/${{ matrix.n }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull
        shell: bash
        run: docker pull "$IMAGE:${{ github.sha }}-arm64"
      - name: baseline
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: rm -rf baseline && .github/validation_baseline.sh baseline
      - name: simulate
        timeout-minutes: 100
        shell: bash
        run: |
          set -uo pipefail
          hostname; uname -m; nproc; free -g
          [ "$REPORT_JOBS" -gt 0 ] || REPORT_JOBS=$(nproc)
          # Each step of a workload may run 900 s, an attention one 1200 s (its S 8192 prefills).
          declare -A cap=([gemm]=--ci [vector]="" [attention]="" [layer]=--ci) budget=([attention]=1200)
          reuse=(); mounts=()
          if [ -f "baseline/$SUITE/results.json" ]; then
            reuse=(--reuse /baseline/results.json); mounts=(-v "$PWD/baseline/$SUITE:/baseline:ro")
          fi
          rm -rf out; mkdir -p out
          t0=$SECONDS
          docker run --rm --name "$CONTAINER" --cpus "$REPORT_JOBS" -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/out:/out" "${mounts[@]}" -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}-arm64" \
            python3 "validation/$SUITE/simulate_shapes.py" --out /out --work /tmp/work --jobs "$REPORT_JOBS" \
              --timeout "${budget[$SUITE]:-900}" --target "$REPORT_TARGET" --shard "$SHARD" ${cap[$SUITE]} "${reuse[@]}"
          rc=$?
          echo "$SUITE shard $SHARD exit $rc after $((SECONDS - t0)) s on $(hostname)"
          exit $rc
      - if: ${{ !cancelled() && hashFiles('out/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.suite }}-${{ matrix.k }}-of-${{ matrix.n }}
          path: out/
          if-no-files-found: error
          retention-days: 3
      - if: always()
        shell: bash
        run: docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

  # Each suite's shards merged into one run's results (simulate_shapes --merge), then the reports, the error targets
  # and the uploads, each report set against the results main's last run left.
  report:
    needs: [tags, compiler, simulate]
    if: ${{ !cancelled() && needs.compiler.result == 'success' }}
    runs-on: [self-hosted, slurm, med, aarch64]
    timeout-minutes: 30
    permissions: {contents: read, packages: read, actions: read, issues: write, pull-requests: write}
    env:
      CONTAINER: rep-${{ github.run_id }}-${{ github.run_attempt }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REF: ${{ github.head_ref || github.ref_name }}
      SUITES: ${{ needs.tags.outputs.suites }}
      PARTIAL: ${{ needs.tags.outputs.partial }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull
        shell: bash
        run: docker pull "$IMAGE:${{ github.sha }}-arm64"
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - id: merge
        name: merge
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for s in $SUITES; do
            rm -rf "$s-validation"; mkdir -p "$s-validation"
            parts=(); for p in shards/shard-"$s"-*/results.json; do [ -f "$p" ] && parts+=("/shards/${p#shards/}"); done
            if [ ${#parts[@]} = 0 ]; then echo "::warning::$s: no shard left results"; rc=1; continue; fi
            docker run --rm --name "$CONTAINER-$s-merge" -u "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD/shards:/shards:ro" -v "$PWD/$s-validation:/out" -w /workspace/pytorchsim-triton-compiler \
              "$IMAGE:${{ github.sha }}-arm64" python3 "validation/$s/simulate_shapes.py" --merge "${parts[@]}" --out /out \
              || { echo "::warning::$s: not every shard left results"; rc=1; }
            jq -r --arg s "$s" '[.shapes[].kernels[]?] | "\($s): \(map(select(.reused)) | length) of \(length) kernels reused the baseline timing"' \
              "$s-validation/results.json" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $rc
      # main's last results, which each report sets this run against (none on main's first run of them).
      - name: baseline
        if: ${{ !cancelled() && steps.merge.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: rm -rf baseline && .github/validation_baseline.sh baseline
      - name: report
        if: ${{ !cancelled() && steps.merge.outcome != 'skipped' }}
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for r in $SUITES; do
            if [ ! -f "$r-validation/results.json" ]; then echo "::warning::$r left no results.json"; rc=1; continue; fi
            base=()
            if [ -f "baseline/$r/results.json" ]; then
              base=(--baseline /out/baseline.json --baseline-commit "$(cat baseline/commit)")
              cp "baseline/$r/results.json" "$r-validation/baseline.json"
            fi
            docker run --rm --name "$CONTAINER-$r-report" -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/$r-validation:/out" \
              -w /workspace/pytorchsim-triton-compiler "$IMAGE:${{ github.sha }}-arm64" \
              python3 "validation/$r/emit_report.py" --results /out/results.json --out /out "${base[@]}" \
                --shapes /out/generated/shapes.csv --commit "$HEAD_SHA" --ref "$REF" \
                --commit-url "${{ github.server_url }}/${{ github.repository }}/commit/$HEAD_SHA" \
                --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                --artifact "$r-validation-$HEAD_SHA" || rc=1
            if [ -f "$r-validation/summary.md" ]; then cat "$r-validation/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          done
          exit $rc
      - name: error targets
        if: ${{ !cancelled() && steps.merge.outcome != 'skipped' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ env.HEAD_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          REF: ${{ github.ref_name }}
        run: |
          prev=(); [ -f baseline/error-targets.json ] && prev=(--previous baseline/error-targets.json)
          suites=(); for s in $SUITES; do suites+=(--suite "$s=$s-validation"); done
          { if [ "$PARTIAL" = true ]; then
              echo "**Partial run** (ci:<suite> labels): only $SUITES timed; the other suites' groups are not measured."
              echo
            fi
            python3 validation/error_targets.py "${suites[@]}" "${prev[@]}" --json error-targets.json
          } > error-targets.md
          export PREV_SHA=$(cat baseline/commit 2>/dev/null)
          cat error-targets.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = push ] && [ "$ON_MAIN" != true ]; then exit 0; fi
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$REF" in claude/*) EVENT=probe ;; *) exit 0 ;; esac
          fi
          TABLE=error-targets.md JSON=error-targets.json bash .github/error_tracker.sh
      - if: ${{ !cancelled() && hashFiles('error-targets.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: error-targets
          path: |
            error-targets.md
            error-targets.json
      - if: ${{ !cancelled() && steps.merge.outcome != 'skipped' && hashFiles('gemm-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gemm-validation-${{ env.HEAD_SHA }}
          path: |
            gemm-validation/report.html
            gemm-validation/summary.md
            gemm-validation/results.json
            gemm-validation/results.csv
            gemm-validation/logs/
            gemm-validation/generated/
            gemm-validation/ir/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: ${{ !cancelled() && steps.merge.outcome != 'skipped' && hashFiles('vector-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-validation-${{ env.HEAD_SHA }}
          path: |
            vector-validation/report.html
            vector-validation/summary.md
            vector-validation/results.json
            vector-validation/results.csv
            vector-validation/logs/
            vector-validation/generated/
            vector-validation/ir/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: ${{ !cancelled() && steps.merge.outcome != 'skipped' && hashFiles('attention-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: attention-validation-${{ env.HEAD_SHA }}
          path: |
            attention-validation/report.html
            attention-validation/summary.md
            attention-validation/results.json
            attention-validation/results.csv
            attention-validation/logs/
            attention-validation/generated/
            attention-validation/ir/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: ${{ !cancelled() && steps.merge.outcome != 'skipped' && hashFiles('layer-validation/results.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: layer-validation-${{ env.HEAD_SHA }}
          path: |
            layer-validation/report.html
            layer-validation/summary.md
            layer-validation/results.json
            layer-validation/results.csv
            layer-validation/logs/
            layer-validation/generated/
            layer-validation/ir/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - if: always()
        shell: bash
        run: |
          for s in gemm vector attention layer; do
            docker rm -f "$CONTAINER-$s-merge" "$CONTAINER-$s-report" >/dev/null 2>&1 || true
          done

  # Each image's per-architecture pair joined under the unsuffixed tag -- the tag the next stage's FROM, PyTorchSim's
  # pin and anyone pulling it name -- so it resolves to the build of the host. imagetools works on the registry and
  # needs no builder container. The compiler pair is joined for pushes only: pull requests do not publish it.
  manifest:
    needs: [tags, compiler, simulate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, packages: write}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        env:
          TRITON_TAG: ${{ needs.tags.outputs.triton }}
          TOOLCHAIN_TAG: ${{ needs.tags.outputs.toolchain }}
          PREBUILT_TAG: ${{ needs.tags.outputs.prebuilt }}
          PUBLISH: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/claude/') }}
          ARCHES: ${{ needs.tags.outputs.arches }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archs=$(jq -r '.[].arch' <<<"$ARCHES")
          wants=$(sed 's/^x64$/amd64/' <<<"$archs")
          join() {
            docker buildx imagetools create -t "$1:$2" $(for a in $archs; do echo "$1:$2-$a"; done)
            got=$(docker buildx imagetools inspect --format '{{range .Manifest.Manifests}}{{.Platform.Architecture}} {{end}}' "$1:$2")
            echo "$1:$2 -> $got"
            for want in $wants; do
              case " $got " in *" $want "*) ;; *) echo "::error::$1:$2 has no $want"; exit 1 ;; esac
            done
          }
          join "$TRITON" "$TRITON_TAG"
          join "$TRITON" latest
          join "$TOOLCHAIN" "$TOOLCHAIN_TAG"
          join "$TOOLCHAIN" latest
          join "$PREBUILT" "$PREBUILT_TAG"
          join "$PREBUILT" latest
          if [ "$PUBLISH" = true ]; then
            join "$IMAGE" "$SHA"
            join "$IMAGE" "$(printf %s "$REF_NAME" | tr '/' '-')"
            join "$IMAGE" "$SHA-runtime"
            join "$IMAGE" "$(printf %s "$REF_NAME" | tr '/' '-')-runtime"
          fi

  # After main's image is published and its reports pass, PyTorchSim gets a pull request moving its compiler pin
  # here: one branch (bot/ptb-bump) force-pushed from its integration branch, one open pull request, the newest
  # main commit winning. A newer run cancels an older one. Needs the PTS_BUMP_TOKEN secret, which can push to
  # PyTorchSim and open pull requests there; this workflow's own token reads this repository and its image.
  pts-pin-bump:
    needs: [compiler, manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: read, packages: read}
    concurrency:
      group: pts-pin-bump
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, persist-credentials: false}
      - shell: bash
        env:
          PTB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PTS_TOKEN: ${{ secrets.PTS_BUMP_TOKEN }}
          NEW: ${{ github.sha }}
        run: |
          if [ -z "$PTS_TOKEN" ]; then echo "::error::the PTS_BUMP_TOKEN secret is not set: no pin bump for PyTorchSim"; exit 1; fi
          .github/pts_pin_bump.sh
